# change 1
# on pull request, it only runs tests and builds the image (no push)
# on push to main, it runs tests, builds the image, tags it with both the Git commit SHA and 'latest', and pushes it to the GitHub Container Registry ghcr.io

name: Continuous Integration & Container Publishing # added "& Container Publishing" (change 1)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# added the entire env block (change 1)
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Execute test suite
        run: npm test

  # this replaced the one below it so we can allow for image registry publishing (change 1)
  build-and-push:
    name: Build & Publish Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }} # expose the image version as an output for downstream jobs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # there was an issue here that caused the workflow to exit with code 1 (error).
            # format=short shortens the SHA to 7 characters, which is a common practice for tagging Docker images with Git commit SHAs
            # when Trivy queries GHCR for the image, it is using the 40-character SHA, so we need to ensure that the tag used for the image push matches what Trivy expects. 
            # By using format=short, we can ensure that the tag is consistent with what Trivy will look for.
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # the above replaced the below (change 1)
  # build-container:
  #   name: Build & Verify Docker Image
  #   needs: test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out repository
  #       uses: actions/checkout@v4

  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3

  #     - name: Build Docker image (Cache only, no push)
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: .
  #         push: false
  #         tags: devops-starter-api:${{ github.sha }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  # change 3 added as a job (can also be added as a step in the build-and-push job if desired)
  container-security-scan:
    name: Run Trivy Vulnerability Scanner
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          # here, we need to pass the short SHA tag to Trivy, since that is what we used to tag the image in the build-and-push job
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs['build-and-push'].outputs['image-tag'] }}
          format: "table"
          exit-code: "0" # Change to '1' to fail the pipeline if critical vulnerabilities are found
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # change 2 added as a job
  deploy:
    name: Trigger Cloud Deployment
    needs: container-security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloud Deploy Webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi
          echo "Sending deployment trigger to cloud runtime..."
          curl -f -X POST "$DEPLOY_HOOK"
          echo "Deployment signal sent successfully."

      # change 4 added as a step
      - name: Verify Live Service Health
        run: |
          echo "Waiting for deployment rollout to stabilize (30s)..."
          sleep 30

          # Retry curl up to 5 times to confirm /health returns 200
          for i in {1..5}; do
            # safe to expose the health endpoint since it is not authenticated and only returns a simple status
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://devops-starter-api-sha-e185178.onrender.com/health)
            if [ "$RESPONSE" -eq 200 ]; then
              echo "Health check passed with HTTP 200!"
              exit 0
            fi
            echo "Attempt $i failed with status $RESPONSE. Retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 5 attempts."
          exit 1
